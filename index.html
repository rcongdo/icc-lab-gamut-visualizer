<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ICC Lab Gamut Visualizer</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="app">
      <section class="toolbar" aria-label="Profile controls">
        <div class="brand">
          <span class="mark" aria-hidden="true"></span>
          <div>
            <h1>ICC Lab Visualizer</h1>
            <p id="profileSummary">CGATS21 CRPC-6 shown as a rotatable CIE Lab gamut</p>
          </div>
        </div>

        <div class="controls">
          <div class="profile-stack">
            <div class="profile-controls">
              <label class="control">
                <span>Profile 1</span>
                <select id="presetSelect1"></select>
              </label>

              <label class="button file-button" title="Load an ICC or ICM RGB/CMYK profile for Profile 1">
                <input id="profileInput1" type="file" accept=".icc,.icm,application/vnd.iccprofile">
                <span>Load ICC</span>
              </label>

              <label class="control mini">
                <span>Opacity</span>
                <input id="opacityRange1" type="range" min="0.05" max="1" step="0.05" value="0.5">
              </label>

              <label class="toggle-control" title="Use a solid color for Profile 1">
                <input id="solidToggle1" type="checkbox">
                <span>Solid</span>
              </label>

              <label class="color-control" title="Profile 1 solid color">
                <input id="solidColor1" type="color" value="#42c7b8">
              </label>
            </div>

            <div class="profile-controls">
              <label class="control">
                <span>Profile 2</span>
                <select id="presetSelect2"></select>
              </label>

              <label class="button file-button" title="Load an ICC or ICM RGB/CMYK profile for Profile 2">
                <input id="profileInput2" type="file" accept=".icc,.icm,application/vnd.iccprofile">
                <span>Load ICC</span>
              </label>

              <label class="control mini">
                <span>Opacity</span>
                <input id="opacityRange2" type="range" min="0.05" max="1" step="0.05" value="0.5">
              </label>

              <label class="toggle-control" title="Use a solid color for Profile 2">
                <input id="solidToggle2" type="checkbox">
                <span>Solid</span>
              </label>

              <label class="color-control" title="Profile 2 solid color">
                <input id="solidColor2" type="color" value="#e4b84b">
              </label>
            </div>
          </div>

          <div class="view-controls">
            <label class="control compact">
              <span>Detail</span>
              <input id="detailRange" type="range" min="9" max="33" step="2" value="23">
            </label>

            <div class="segmented" role="radiogroup" aria-label="Render mode">
              <button id="surfaceMode" class="active" type="button" aria-pressed="true">Surface</button>
              <button id="pointsMode" type="button" aria-pressed="false">Points</button>
            </div>
          </div>
        </div>
      </section>

      <section class="viewer-shell">
        <canvas id="gamutCanvas" aria-label="Rotatable 3D CIE Lab gamut visualization"></canvas>
        <div class="axis-labels" aria-hidden="true">
          <span id="labelL">L*</span>
          <span id="labelPosA">+a*</span>
          <span id="labelNegA">-a*</span>
          <span id="labelPosB">+b*</span>
          <span id="labelNegB">-b*</span>
        </div>
        <div class="legend" aria-hidden="true">
          <span>L*</span>
          <span>a*</span>
          <span>b*</span>
        </div>
        <div id="status" class="status" role="status"></div>
      </section>

      <section class="profile-info-panel" aria-label="Profile information">
        <article class="profile-info-card">
          <div>
            <strong id="profileInfoName1">CGATS21 CRPC-6</strong>
            <span id="profileInfoMeta1">CMYK reference profile</span>
          </div>
          <span id="profileInfoVolume1">Volume: calculating...</span>
          <pre id="profileInfoSamples1">White: calculating...</pre>
        </article>

        <article class="profile-info-card muted-card">
          <div>
            <strong id="profileInfoName2">None</strong>
            <span id="profileInfoMeta2">Comparison disabled</span>
          </div>
          <span id="profileInfoVolume2">Volume: --</span>
          <pre id="profileInfoSamples2">No comparison profile selected.</pre>
        </article>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
